name: Validate Part 1 Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required documentation files exist
        run: |
          if [ ! -f "./API_Endpoint_Plan.md" ]; then
            echo "Error: API_Endpoint_Plan.md is missing!"
            exit 1
          fi

          if ! ls ./*RaceDay*Schema*.sql 1> /dev/null 2>&1; then
            echo "Error: RaceDay schema file is missing!"
            exit 1
          fi

          echo "✓ Required documentation files exist"

      - name: Check ERD file exists
        run: |
          if ! ls ./*ERD*.* 1> /dev/null 2>&1; then
            echo "Error: ERD image/file is missing!"
            exit 1
          fi
          echo "✓ ERD file exists"

      - name: Validation Complete
        run: echo "All Part 1 documentation files are present! ✅"